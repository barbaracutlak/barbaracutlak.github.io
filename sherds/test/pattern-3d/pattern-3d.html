<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Drawing Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="canvas3d"></div>

    <!-- Center pottery shard image -->
    <img src="images/54-142-63.png" alt="Pottery Shard" class="center-image" id="centerImage">

    <div class="controls">
        <h3>3D Drawing</h3>

        <label>
            Color:
            <input type="color" id="colorPicker" value="#00ff00">
        </label>

        <label>
            Brush Size: <span id="sizeDisplay">0.1</span>
            <input type="range" id="brushSize" min="0.01" max="0.5" step="0.01" value="0.1">
        </label>

        <label>
            Image Size: <span id="imageSizeDisplay">30</span>%
            <input type="range" id="imageSize" min="10" max="60" value="30">
        </label>

        <button id="clearBtn">Clear All</button>
        <button id="undoBtn">Undo Last</button>
    </div>

    <div class="info">
        <strong>Controls:</strong><br>
        Left Click + Drag: Draw<br>
        Right Click + Drag: Rotate Camera<br>
        Scroll: Zoom In/Out
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
